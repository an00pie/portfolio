<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <radialGradient id="portraitGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7ED957" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#121316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#16181D"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ED957" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7ED957" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#0B0C0E"/>
  <rect width="800" height="1000" fill="url(#portraitGlow)"/>

  <!-- Minimal Grid lines -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- Abstract Editorial Figure / Silhouette -->
  <g transform="translate(150, 180)">
    <!-- Aura halo -->
    <ellipse cx="250" cy="240" rx="180" ry="180" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-dasharray="8 12"/>
    
    <!-- Head silhouette -->
    <path d="M250 120 C180 120 150 170 150 250 C150 330 180 370 210 390 L210 430 C130 460 70 530 50 650 L450 650 C430 530 370 460 290 430 L290 390 C320 370 350 330 350 250 C350 170 320 120 250 120 Z" fill="url(#silhouetteGrad)"/>

    <!-- Subtle edge lighting -->
    <path d="M150 250 C150 170 180 120 250 120 C320 120 350 170 350 250" fill="none" stroke="#7ED957" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Geometric Tech Accent on shoulders -->
    <path d="M100 600 L250 510 L400 600" stroke="#7ED957" stroke-width="2" stroke-opacity="0.4" fill="none"/>
  </g>

  <!-- Frame border -->
  <rect x="20" y="20" width="760" height="960" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Editorial typography labels -->
  <text x="50" y="80" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="3">PORTRAIT // ARCHIVE 2026</text>
  <text x="50" y="900" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Anoop Danimon</text>
  <text x="50" y="930" fill="#7ED957" font-family="Inter, sans-serif" font-size="16" font-weight="500" letter-spacing="1">THRISSUR, KERALA • DATA SCIENCE &amp; DEV</text>
  
  <!-- Status badge -->
  <circle cx="730" cy="80" r="6" fill="#7ED957"/>
  <circle cx="730" cy="80" r="10" stroke="#7ED957" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
