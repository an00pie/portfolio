<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="busBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#busBg)"/>

  <!-- Top bar -->
  <rect x="60" y="50" width="1080" height="60" rx="8" fill="#171A21" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="85" y="70" width="16" height="20" rx="4" fill="#7ED957"/>
  <text x="115" y="86" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">BUS SAHAYI // KSRTC PASSENGER GRIEVANCE PORTAL</text>
  <rect x="910" y="65" width="210" height="30" rx="15" fill="rgba(126,217,87,0.15)"/>
  <text x="925" y="85" fill="#7ED957" font-family="Inter, sans-serif" font-size="13" font-weight="600">ANAVANDI HACK • TOP 16</text>

  <!-- Left Column: Passenger Complaint Flow Interface -->
  <g transform="translate(60, 140)">
    <rect width="520" height="580" rx="16" fill="#14171E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Mobile-style preview card -->
    <rect x="30" y="30" width="460" height="70" rx="10" fill="#1D212A"/>
    <text x="50" y="60" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">REF NO: KL-KSRTC-94821</text>
    <text x="50" y="82" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="600">Route 408: Ernakulam ➔ Munnar</text>
    <circle cx="450" cy="65" r="8" fill="#7ED957"/>

    <!-- Form Inputs simulated -->
    <rect x="30" y="120" width="460" height="50" rx="8" fill="#1A1E26" stroke="rgba(255,255,255,0.08)"/>
    <text x="50" y="150" fill="#E5E7EB" font-family="monospace" font-size="14">Bus Reg: KL-15-A-2841 [Super Fast]</text>

    <rect x="30" y="185" width="460" height="90" rx="8" fill="#1A1E26" stroke="rgba(255,255,255,0.08)"/>
    <text x="50" y="215" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="13">Grievance category: AC Air Quality &amp; Ticket Discrepancy</text>
    <text x="50" y="240" fill="#7ED957" font-family="Inter, sans-serif" font-size="12">✓ Geo-tag attached: 10.0889° N, 77.0595° E (Near Adimali)</text>

    <!-- Depot auto-route badge -->
    <rect x="30" y="295" width="460" height="60" rx="8" fill="rgba(126,217,87,0.08)" stroke="rgba(126,217,87,0.2)"/>
    <text x="50" y="325" fill="#7ED957" font-family="Inter, sans-serif" font-size="14" font-weight="600">AUTO-ROUTED TO: KSRTC Kothamangalam Depot</text>
    <text x="50" y="342" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Status: In Review by Controlling Inspector</text>

    <!-- Timeline bar -->
    <line x1="50" y1="400" x2="470" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="90" cy="400" r="10" fill="#7ED957"/>
    <circle cx="260" cy="400" r="10" fill="#7ED957"/>
    <circle cx="430" cy="400" r="10" fill="#374151" stroke="#7ED957" stroke-width="2"/>
    <text x="60" y="435" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12">Submitted</text>
    <text x="230" y="435" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12">Depot Triaged</text>
    <text x="400" y="435" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">Resolved</text>

    <!-- Pitch Note -->
    <rect x="30" y="480" width="460" height="70" rx="10" fill="#181C24"/>
    <text x="50" y="510" fill="#D1D5DB" font-family="Inter, sans-serif" font-size="13">"Built overnight &amp; pitched live to judges inside a</text>
    <text x="50" y="530" fill="#7ED957" font-family="Inter, sans-serif" font-size="13" font-weight="600">KSRTC coach winding up the hills of Munnar."</text>
  </g>

  <!-- Right Column: Regional Depot Map & SLA Matrix -->
  <g transform="translate(610, 140)">
    <rect width="530" height="580" rx="16" fill="#14171E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="40" y="50" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">REGIONAL DEPOT MONITORING</text>
    <text x="40" y="75" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="13">Live resolution heatmap across KSRTC Southern &amp; Central zones</text>

    <!-- Abstract Map Graphic with Connected Nodes -->
    <g transform="translate(40, 100)">
      <!-- Map base -->
      <rect width="450" height="300" rx="12" fill="#111317" stroke="rgba(255,255,255,0.04)"/>
      
      <!-- Nodes / Depots -->
      <!-- Munnar -->
      <circle cx="360" cy="70" r="12" fill="#7ED957" fill-opacity="0.2"/>
      <circle cx="360" cy="70" r="6" fill="#7ED957"/>
      <text x="310" y="50" fill="#FFFFFF" font-family="monospace" font-size="12">Munnar (0 Pend)</text>

      <!-- Ernakulam -->
      <circle cx="120" cy="140" r="18" fill="#F59E0B" fill-opacity="0.2"/>
      <circle cx="120" cy="140" r="7" fill="#F59E0B"/>
      <text x="50" y="180" fill="#FFFFFF" font-family="monospace" font-size="12">Ernakulam (4 Pend)</text>

      <!-- Kothamangalam -->
      <circle cx="240" cy="110" r="14" fill="#7ED957" fill-opacity="0.2"/>
      <circle cx="240" cy="110" r="6" fill="#7ED957"/>
      <text x="180" y="95" fill="#FFFFFF" font-family="monospace" font-size="12">Kothamangalam</text>

      <!-- Thrissur -->
      <circle cx="140" cy="60" r="14" fill="#7ED957" fill-opacity="0.2"/>
      <circle cx="140" cy="60" r="6" fill="#7ED957"/>
      <text x="90" y="45" fill="#FFFFFF" font-family="monospace" font-size="12">Thrissur</text>

      <!-- Connecting route lines -->
      <path d="M 140 60 L 120 140 L 240 110 L 360 70" fill="none" stroke="#7ED957" stroke-width="2" stroke-dasharray="4 6"/>
    </g>

    <!-- Metrics row -->
    <g transform="translate(40, 430)">
      <rect width="135" height="110" rx="8" fill="#1A1E26"/>
      <text x="20" y="35" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">AVG RESOLUTION</text>
      <text x="20" y="70" fill="#7ED957" font-family="monospace" font-size="28" font-weight="700">3.4h</text>
      <text x="20" y="95" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">-42% vs paper</text>

      <rect x="155" width="135" height="110" rx="8" fill="#1A1E26"/>
      <text x="175" y="35" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">AUTO-ROUTING</text>
      <text x="175" y="70" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="700">99.1%</text>
      <text x="175" y="95" fill="#7ED957" font-family="Inter, sans-serif" font-size="11">Zero manual triage</text>

      <rect x="310" width="140" height="110" rx="8" fill="#1A1E26"/>
      <text x="330" y="35" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="12">SATISFACTION</text>
      <text x="330" y="70" fill="#7ED957" font-family="monospace" font-size="28" font-weight="700">4.8/5</text>
      <text x="330" y="95" fill="#9CA3AF" font-family="Inter, sans-serif" font-size="11">Direct commuter rated</text>
    </g>
  </g>
</svg>
